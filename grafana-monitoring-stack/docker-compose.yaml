---
services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_METRICS_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - ${GRAFANA_PORT}:3000
    volumes:
      - ${DOCKERCONFDIR}/grafana/data:/var/lib/grafana
      - ${STACKDIR}/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${STACKDIR}/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - skynet

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - ${PROMETHEUS_PORT}:9090
    volumes:
      - ${STACKDIR}/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DOCKERCONFDIR}/prometheus/data:/prometheus
    networks:
      - skynet

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    ports:
      - ${NODE_EXPORTER_PORT}:9100
    volumes:
      - /:/host:ro,rslave
    networks:
      - skynet

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - ${CADVISOR_PORT}:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - skynet

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yaml
    ports:
      - ${LOKI_PORT}:3100
    volumes:
      - ${STACKDIR}/config/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ${DOCKERCONFDIR}/loki/data:/loki
    networks:
      - skynet

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - ${ALLOY_PORT}:12345
    volumes:
      - ${STACKDIR}/config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${DOCKERCONFDIR}/alloy/data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - skynet

networks:
  skynet:
    name: skynet
    driver: bridge
