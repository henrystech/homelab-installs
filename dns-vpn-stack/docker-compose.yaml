---
services:
  adguard-home:
    image: adguard/adguardhome:latest
    container_name: adguard-home
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - ${ADGUARD_DNS_PORT}:53/tcp
      - ${ADGUARD_DNS_PORT}:53/udp
      - ${ADGUARD_SETUP_PORT}:3000/tcp
      - ${ADGUARD_HTTP_PORT}:80/tcp
    volumes:
      - ${DOCKERCONFDIR}/adguard/work:/opt/adguardhome/work
      - ${DOCKERCONFDIR}/adguard/conf:/opt/adguardhome/conf
    networks:
      - skynet

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    restart: unless-stopped
    environment:
      WG_HOST: ${WG_HOST}
      PASSWORD_HASH: ${WG_PASSWORD_HASH}
      WG_DEFAULT_DNS: ${WG_DEFAULT_DNS}
    ports:
      - ${WG_UDP_PORT}:51820/udp
      - ${WG_WEB_PORT}:51821/tcp
    volumes:
      - ${DOCKERCONFDIR}/wg-easy:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    profiles:
      - wireguard
    networks:
      - skynet

networks:
  skynet:
    name: skynet
    driver: bridge
